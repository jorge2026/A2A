name: Kubernetes Platform CI

on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = list(Path("apps").rglob("*.yaml")) + list(Path("platform").rglob("*.yaml")) + list(Path("argocd").rglob("*.yaml"))
          assert files, "No Kubernetes YAML files found"
          for path in files:
              list(yaml.safe_load_all(path.read_text()))
              print(f"Validated YAML: {path}")
          PY

      - name: Validate manifests with kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -summary apps/demo platform/namespaces.yaml
